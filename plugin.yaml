apiVersion: v1
type: cli/v1
runtime: subprocess
name: "push-artifactory"
version: "0.4.2"
config:
  usage: "push-artifactory"
  shortHelp: "Push helm charts to artifactory"
  longHelp: "Please see https://github.com/belitre/helm-push-artifactory-plugin for usage"
  ignoreFlags: false
runtimeConfig:
  platformCommand:
    - os: linux
      arch: amd64
      command: "$HELM_PLUGIN_DIR/bin/helm-push-artifactory"
    - os: darwin
      arch: amd64
      command: "$HELM_PLUGIN_DIR/bin/helm-push-artifactory"
    - os: darwin
      arch: arm64
      command: "$HELM_PLUGIN_DIR/bin/helm-push-artifactory"
  platformHooks:
    install:
      - os: linux
        arch: amd64
        command: "$HELM_PLUGIN_DIR/scripts/install_plugin.sh"
      - os: darwin
        arch: amd64
        command: "$HELM_PLUGIN_DIR/scripts/install_plugin.sh"
      - os: darwin
        arch: arm64
        command: "$HELM_PLUGIN_DIR/scripts/install_plugin.sh"
    update:
      - os: linux
        arch: amd64
        command: "$HELM_PLUGIN_DIR/scripts/install_plugin.sh"
      - os: darwin
        arch: amd64
        command: "$HELM_PLUGIN_DIR/scripts/install_plugin.sh"
      - os: darwin
        arch: arm64
        command: "$HELM_PLUGIN_DIR/scripts/install_plugin.sh"
